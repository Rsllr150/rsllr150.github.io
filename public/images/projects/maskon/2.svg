<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">MaskON — streaming with a sliding overlap buffer</title>
<desc id="d">Cutting a large log naively at chunk boundaries splits an IBAN in two and both halves leak in clear. MaskON keeps the last 64 characters of each chunk in a trailing buffer and never cuts through a finding, so the split IBAN reappears whole and is masked, with bounded memory.</desc>
<defs>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#C8102E" stroke-width="1.2" opacity=".35"/></pattern>
  <style>
    .k{font-size:11px;letter-spacing:.2em;fill:#7A766E}
    .t{font-size:13.5px;fill:#141414}
  </style>
</defs>
<rect width="1200" height="620" fill="#F5F3EE"/>
<rect x="24" y="24" width="1152" height="572" fill="none" stroke="#141414" stroke-width="1.2"/>
<rect x="30" y="30" width="1140" height="560" fill="none" stroke="#141414" stroke-width=".5"/>
<text x="60" y="72" class="k">MASKON / STREAMING / BOUNDED MEMORY</text>
<text x="60" y="108" font-size="28" font-weight="700" fill="#141414">A PII cut in half is still a PII.</text>

<!-- naive -->
<text x="60" y="166" class="k">NAIVE CHUNKING</text>
<rect x="60" y="180" width="520" height="44" fill="#FFFFFF" stroke="#141414"/>
<rect x="600" y="180" width="540" height="44" fill="#FFFFFF" stroke="#141414"/>
<text x="72" y="174" font-size="11" fill="#7A766E" dx="430">chunk n</text>
<text x="612" y="174" font-size="11" fill="#7A766E">chunk n+1</text>
<text x="76" y="207" class="t">… 12:04:31 payout ok  IBAN <tspan fill="#C8102E">FR76 3000 6000</tspan></text>
<text x="614" y="207" class="t"><tspan fill="#C8102E">0112 3456 7890 189</tspan>  ref=88 …</text>
<line x1="590" y1="168" x2="590" y2="236" stroke="#C8102E" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="60" y="262" font-size="13" fill="#C8102E">✕ neither half matches an IBAN: both leak in clear</text>

<!-- overlap -->
<text x="60" y="330" class="k">MASKON · SLIDING OVERLAP BUFFER</text>
<rect x="60" y="344" width="520" height="44" fill="#FFFFFF" stroke="#141414"/>
<rect x="420" y="344" width="160" height="44" fill="url(#hatch)" stroke="#C8102E" stroke-width="1"/>
<text x="76" y="371" class="t">… 12:04:31 payout ok  IBAN</text>
<text x="432" y="371" class="t" fill="#C8102E">FR76 3000 6000</text>
<text x="424" y="338" font-size="11" fill="#C8102E">last 64 chars held</text>

<path d="M500 392 C500 430 600 410 640 436" fill="none" stroke="#141414" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="420" y="440" width="720" height="44" fill="#FFFFFF" stroke="#141414"/>
<rect x="420" y="440" width="160" height="44" fill="url(#hatch)" stroke="#C8102E" stroke-width="1"/>
<text x="436" y="467" class="t">IBAN</text>
<rect x="486" y="452" width="66" height="22" fill="#141414"><animate attributeName="width" values="0;66;66" keyTimes="0;.35;1" dur="4s" repeatCount="indefinite"/></rect>
<text x="496" y="467" font-size="13" fill="#F5F3EE">[IBAN]</text>
<text x="566" y="467" class="t">ref=88 …</text>
<text x="420" y="510" font-size="13" fill="#141414">✓ the split IBAN reappears whole in the buffer, and is masked</text>

<line x1="60" y1="540" x2="1140" y2="540" stroke="#141414" stroke-width=".6"/>
<g font-size="13" fill="#4A4740">
  <text x="60" y="570">emit all but the last 64 chars · never cut through a finding · constant memory on a 2 GB log</text>
</g>
</svg>
