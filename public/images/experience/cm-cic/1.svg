<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="Fabrikat,'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">CM-CIC — market impact with its uncertainty, and the pacing rule it drives</title>
<desc id="d">Schematic curve shapes, not desk data. Left: temporary impact grows concavely with participation, permanent impact linearly, with a 90% credible band from the Bayesian model. Right: above a threshold of predictive uncertainty the participation cap is curtailed down to a floor. Measured out of sample: R squared 0.68, MAE 1.4 bps, NLL 25% below baseline, shortfall down 1.8 bps on large meta-orders.</desc>
