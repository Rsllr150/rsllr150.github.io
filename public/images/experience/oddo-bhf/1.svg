<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d" font-family="Lato,'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">ODDO BHF — fill to P&amp;L and TCA, the same day</title>
<desc id="d">Schematic. Front-office trades flow through a pipeline between traders and IT into intraday P&amp;L and transaction cost analysis; the cost per venue and tactic feeds back into the choice between VWAP, dark and liquidity-seeker algorithms.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#272529"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#B9D3B9"/></marker>
  <style>
    .serif{font-family:'Libre Baskerville',Baskerville,Georgia,serif}
    .eye{font-size:13px;font-weight:700;letter-spacing:.16em;fill:#272529}
    .box{fill:#FFFFFF;stroke:#DCD6D1;stroke-width:1}
    .bt{font-size:20px;font-weight:300;letter-spacing:.08em;fill:#272529}
    .bs{font-size:14px;fill:#696969}
    .num{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#CF2014}
  </style>
</defs>
<rect width="1200" height="620" fill="#F7F4F2"/>
<line x1="60" y1="66" x2="104" y2="66" stroke="#272529" stroke-width="1.4"/>
<text x="120" y="71" class="eye">ODDO BHF · FRONT OFFICE</text>
<text x="60" y="128" font-size="40" font-weight="300" fill="#272529" letter-spacing=".02em">FROM FILL TO P&amp;L, <tspan class="serif" font-style="italic" font-size="38" fill="#CF2014">the same day</tspan></text>
<text x="1140" y="71" text-anchor="end" font-size="12" fill="#696969" letter-spacing=".12em">SCHEMATIC</text>

<!-- flow -->
<g transform="translate(60 176)">
  <rect class="box" width="236" height="150"/>
  <rect width="236" height="4" fill="#CF2014"/>
  <text x="24" y="40" class="num">01</text>
  <text x="24" y="76" class="bt">TRADES</text>
  <text x="24" y="104" class="bs">front office</text>
  <text x="24" y="128" class="bs"><tspan font-weight="700" fill="#272529">20k+</tspan> a day</text>
</g>
<g transform="translate(336 176)">
  <rect class="box" width="236" height="150"/>
  <rect width="236" height="4" fill="#272529"/>
  <text x="24" y="40" class="num">02</text>
  <text x="24" y="76" class="bt">PIPELINE</text>
  <text x="24" y="104" class="bs">traders ↔ IT</text>
  <text x="24" y="128" class="bs"><tspan font-weight="700" fill="#272529">400+</tspan> parameters</text>
</g>
<g transform="translate(612 176)">
  <rect class="box" width="236" height="150"/>
  <rect width="236" height="4" fill="#272529"/>
  <text x="24" y="40" class="num">03</text>
  <text x="24" y="76" class="bt">P&amp;L</text>
  <text x="24" y="104" class="bs">intraday,</text>
  <text x="24" y="128" class="bs">no batch wait</text>
</g>
<g transform="translate(888 176)">
  <rect class="box" width="252" height="150"/>
  <rect width="252" height="4" fill="#272529"/>
  <text x="24" y="40" class="num">04</text>
  <text x="24" y="76" class="bt">TCA</text>
  <text x="24" y="104" class="bs">cost per venue</text>
  <text x="24" y="128" class="bs">and per tactic</text>
</g>
<g stroke="#272529" stroke-width="1.4" marker-end="url(#ar)"><line x1="298" y1="251" x2="332" y2="251"/><line x1="574" y1="251" x2="608" y2="251"/><line x1="850" y1="251" x2="884" y2="251"/></g>

<!-- loop -->
<rect x="60" y="370" width="1080" height="190" fill="#003D39"/>
<line x1="92" y1="410" x2="124" y2="410" stroke="#B9D3B9" stroke-width="1.2"/>
<text x="136" y="415" font-size="13" font-weight="700" letter-spacing=".16em" fill="#B9D3B9">ALGO TRADING OPTIMISATION</text>
<text x="92" y="462" font-size="26" font-weight="300" fill="#FFFFFF">Fill quality goes <tspan class="serif" font-style="italic" font-size="25">back into</tspan> the choice of algo.</text>
<g font-size="15" fill="#FFFFFF" letter-spacing=".1em">
  <rect x="92" y="490" width="120" height="40" fill="none" stroke="#B9D3B9"/><text x="152" y="516" text-anchor="middle">VWAP</text>
  <rect x="226" y="490" width="120" height="40" fill="none" stroke="#B9D3B9"/><text x="286" y="516" text-anchor="middle">DARK</text>
  <rect x="360" y="490" width="210" height="40" fill="#2A7D5E" stroke="#B9D3B9"/><text x="465" y="516" text-anchor="middle">LIQUIDITY SEEKER</text>
</g>
<path d="M1014 328 L1014 440 Q1014 510 944 510 L586 510" fill="none" stroke="#B9D3B9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
<text x="1030" y="400" font-size="13" fill="#B9D3B9" letter-spacing=".06em">TCA</text>
<text x="1030" y="418" font-size="13" fill="#B9D3B9" letter-spacing=".06em">feedback</text>
<text x="1110" y="540" text-anchor="end" font-size="13" fill="#B9D3B9">12 desk tools · FastAPI / React</text>
</svg>
